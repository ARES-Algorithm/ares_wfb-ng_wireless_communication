# Transparent UDP wireless profile: robot. Application payloads are opaque.
[path]
conf_dir = '/etc'
bin_dir = '/usr/local/bin'
tmp_dir = '/tmp'
log_dir = '/var/log'

[common]
debug = False
version = 'dev'
commit = 'oal'
primary = True
log_file = None
binary_log_file = None
set_nm_unmanaged = True
radio_mtu = 1445
tunnel_agg_timeout = 0.005
mavlink_agg_timeout = 0.1
mavlink_err_rate = True
log_interval = 1000
tx_sel_rssi_delta = 3
tx_sel_counter_abs_delta = 3
tx_sel_counter_rel_delta = 0.1
tx_rcv_buf_size = 2097152
rx_snd_buf_size = 2097152
wifi_channel = 165
wifi_region = 'BO'
wifi_txpower = None
temp_measurement_interval = 10
temp_overheat_warning = 60

[cluster]
nodes = {}
ssh_user = 'root'
ssh_port = 22
ssh_key = None
custom_init_script = None
server_address = None
base_port_server = 10000
base_port_node = 11000

[base]
stream_rx = None
stream_tx = None
keypair = None
mirror = False
bandwidth = 20
force_vht = False
short_gi = False
stbc = 1
ldpc = 1
mcs_index = 1
use_qdisc = False
fwmark = 0
control_port = 0
injection_retries = 10
injection_retry_delay = 5000

[radio_base]
frame_type = 'data'
fec_k = 2
fec_n = 4
fec_timeout = 0
fec_delay = 0

[drone_base]
keypair = 'drone.key'

[robot]
streams = [
    {'name': 'data_tx', 'stream_tx': 0x03, 'stream_rx': None, 'service_type': 'udp_direct_tx',
     'profiles': ['base', 'radio_base', 'drone_base'],
     'peer': 'listen://127.0.0.1:5642'},
    {'name': 'data_rx', 'stream_tx': None, 'stream_rx': 0x81, 'service_type': 'udp_direct_rx',
     'profiles': ['base', 'radio_base', 'drone_base'],
     'peer': 'connect://127.0.0.2:5641'}
    ]
stats_port = 8002
api_port = 8102
link_domain = 'oal-link'
